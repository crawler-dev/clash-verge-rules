name: cron

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */2 * * *'
    - cron: '30 11,13,19,21 * * *'

jobs:
  generate:
    name: Generate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    permissions:
      contents: write
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Generate Content
        run: |
          echo "🔄 更新 Clash-Verge 规则集"
          echo "🕐 当前时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "📦 规则集来源: https://github.com/clash-verge/clash-verge.github.io"
          # 设置目录路径
          BASE_DIR="dist/gh-pages"
          DAILY_DIR="${BASE_DIR}/$(date '+%Y/%m/%d')"
          # 创建目录
          mkdir -p "$BASE_DIR" "$DAILY_DIR"
          # 生成变量
          DATE=$(date '+%Y%m%d')
          MONTH=$(date '+%Y/%m')
          for i in {0..4}; do
              # 构造 URL
              YAML_URL="https://clash-verge.github.io/uploads/$MONTH/${i}-${DATE}.yaml"
              TXT_URL="https://clash-verge.github.io/uploads/$MONTH/${i}-${DATE}.txt"
              # 下载 YAML 文件（仅在存在时）
              echo "🔗 YAML: ${YAML_URL}"
              if curl --head --silent --fail --retry 3 --retry-delay 5 "$YAML_URL" >/dev/null; then
                  # 单次下载并同时写入两个目标路径
                  curl --retry 3 --retry-delay 5 -sS "$YAML_URL" | tee \
                      "${BASE_DIR}/clash-${i}.yaml" \
                      "${DAILY_DIR}/clash-${i}.yaml" >/dev/null
                  echo "✅ 下载 YAML 文件: ${i}-${DATE}.yaml"
              else
                  echo "⏭️ 跳过不存在的 YAML 文件: ${i}-${DATE}.yaml"
              fi
              # 下载 TXT 文件（仅在存在时）
              echo "🔗 TXT: ${TXT_URL}"
              if curl --head --silent --fail --retry 3 --retry-delay 5 "$TXT_URL" >/dev/null; then
                  # 单次下载并同时写入两个目标路径
                  curl --retry 3 --retry-delay 5 -sS "$TXT_URL" | tee \
                      "${BASE_DIR}/v2ray-${i}.txt" \
                      "${DAILY_DIR}/v2ray-${i}.txt" >/dev/null
                  echo "✅ 下载 TXT 文件: ${i}-${DATE}.txt"
              else
                  echo "⏭️ 跳过不存在的 TXT 文件: ${i}-${DATE}.txt"
              fi
          done
          # 构造 URL
          JSON_URL="https://clash-verge.github.io/uploads/$MONTH/${DATE}.json"
          # 下载 JSON 文件（仅在存在时）
          echo "🔗 JSON: ${JSON_URL}"
          if curl --head --silent --fail --retry 3 --retry-delay 5 "$JSON_URL" >/dev/null; then
              # 单次下载并同时写入两个目标路径
              curl --retry 3 --retry-delay 5 -sS "$JSON_URL" | tee \
                  "${BASE_DIR}/sing-box.json" \
                  "${DAILY_DIR}/sing-box.json" >/dev/null
              echo "✅ 下载 JSON 文件: ${DATE}.json"
          else
              echo "⏭️ 跳过不存在的 JSON 文件: ${DATE}.json"
          fi
      - name: Checkout Github Pages
        continue-on-error: true # 忽略 gh-pages 分支未创建
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages
      - name: Merge Github Pages
        run: |
          # 避免 gh-pages 分支未创建
          mkdir -p gh-pages‌
          #
          if [ -d dist/gh-pages ]; then cp -rf dist/gh-pages/. gh-pages/; fi
      - name: Deploy Github Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: gh-pages
          branch: gh-pages
